name: Build and beta release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/Emby.EpgImages/Emby.EpgImages.csproj
      - run: dotnet build src/Emby.EpgImages/Emby.EpgImages.csproj -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Images
          path: |
            src/Emby.EpgImages/bin/Release/net8.0/Emby.EpgImages.dll
            README.md
            LICENSE
            CHANGELOG.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Live-TV-Images
          path: artifacts
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Live TV Images $RELEASE_TAG" --prerelease --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/src/Emby.EpgImages/bin/Release/net8.0/Emby.EpgImages.dll --clobber

